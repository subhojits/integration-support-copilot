spring.application.name=integration-support-copilot
server.port=8080

# =========================================================
# SAP AI Core / Generative AI Hub Orchestration Settings
# =========================================================
sap.ai.token-url=${SAP_AI_TOKEN_URL}
sap.ai.client-id=${SAP_AI_CLIENT_ID}
sap.ai.client-secret=${SAP_AI_CLIENT_SECRET}
sap.ai.completion-url=${SAP_AI_COMPLETION_URL}
sap.ai.resource-group=${SAP_AI_RESOURCE_GROUP:default}
sap.ai.orchestration-config-id=${SAP_AI_ORCHESTRATION_CONFIG_ID}

# =========================================================
# SAP Cloud Integration - Process Integration Runtime API
# Used to fetch failed Message Processing Logs
# =========================================================
#
sap.cpi.token-url=${SAP_CPI_TOKEN_URL}
sap.cpi.client-id=${SAP_CPI_CLIENT_ID}
sap.cpi.client-secret=${SAP_CPI_CLIENT_SECRET}
sap.cpi.base-url=${SAP_CPI_BASE_URL}

# =========================================================
# CPI Monitoring UI Defaults
# =========================================================
sap.cpi.failed-message-limit=15
sap.cpi.default-time-window=24h